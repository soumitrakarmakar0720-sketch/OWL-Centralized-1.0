services:
  - type: web
    name: owl-unified-portal
    runtime: python
    rootDir: portal
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OWL_STORE_URL
        value: https://owldigital.shop
      - key: OWL_FINANCE_URL
        value: https://owlfinance.shop
